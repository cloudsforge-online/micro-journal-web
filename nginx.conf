# The Forge Journal's server block.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
# EVERY `location` IN THIS FILE BEGINS `/journal`, AND THAT IS THE FIRST THING TO KNOW.
#
# This publication is a FOLDER on the apex — `https://cloudsforge.online/journal` — rather than a
# hostname of its own. Wave 1 of the consolidation in micro-deploy `docs/apex-consolidation.md`; the
# reason is that an archive is the one surface whose whole job is to be found, and a subdomain is a
# separate site to a search engine no matter how many links point across.
#
# THE PREFIX IS NOT STRIPPED ON THE WAY IN. The gateway matches `PathPrefix('/journal')` and passes
# the URI through whole, so this server is asked for `/journal/a/<slug>`, the Dockerfile copies the
# build into `html/journal/`, and `root` + the URI is a real file with no rewriting anywhere. The
# alternative was a `StripPrefix` middleware, and it was rejected for one property: with the prefix
# carried the whole way down, the address is the SAME STRING in every place it appears — in
# `vite.config.ts`'s `base`, in the router's `basename`, in each `location` below, on disk, under
# `pnpm dev`, under `vite preview`, in a curl straight at this container, and in a reader's bar.
# Under a stripping middleware this file is the one place it differs, which is the place nobody
# looks when a path 404s in production and works everywhere else.
#
# The two exceptions, both deliberate: `/healthz` is the container's own probe and belongs to the
# container, not to the publication; and `location /` answers 404 because nothing outside the mount
# was ever this image's to serve.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════════
# TWO MORE THINGS TO UNDERSTAND HERE, AND THE SECOND ONE IS UNUSUAL.
#
# ── 1. AN UNKNOWN PATH ANSWERS 404, AND NOTHING HAD TO BE ENUMERATED TO ACHIEVE IT ────────────────
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# Every OTHER frontend in the estate answers that by enumerating its routes in this file, one
# `location` per route, kept in step by a test. THIS SURFACE DOES NOT HAVE TO, and the reason is the
# only genuinely nice consequence of prerendering: `scripts/prerender.ts` writes a real file for
# every address this publication has — `dist/a/<slug>/index.html`, `dist/topics/<slug>/index.html`,
# forty-odd of them — so the file set IS the route set. `try_files $uri $uri/index.html` finds the
# ones that exist and 404s the ones that do not, with no list to keep in step and therefore no list
# to get wrong.
#
# It is also STRICTER than an enumeration, which is worth saying because it looks looser. An
# enumerated `location ~ ^/a(/|$)` answers 200 for `/a/an-article-that-was-never-written`; here that
# address has no file and 404s, which is the truth. The exchange could not do this because its
# `/pools/0x…` really is an unbounded client-side route. An archive's is not: an article that has
# not been written is not an address.
#
# `error_page 404 /journal/404.html` is what serves a designed page UNDER the real status.
#
# ── 2. THE ABSOLUTE URLs ARE FILLED IN HERE, PER REQUEST ──────────────────────────────────────────
#
# SEO needs absolute addresses: a canonical link, `og:url`, the RSS channel link and the `@id` of
# every JSON-LD `Article` must each name a scheme and a host, and a relative one is discarded. They
# are written into static files at BUILD time, when no host is known.
#
# Baking one in fails in the direction that does not look like a failure. The page renders, the card
# renders, and the canonical tag on `testnet.<apex>/journal` quietly tells every search engine that
# the real copy of this article lives on the mainnet host — so the testnet archive is de-indexed in
# favour of an origin the reader was never on, and every share link from it resolves somewhere else.
#
# So the prerender writes the literal `__CF_ORIGIN__` wherever an absolute URL belongs and this file
# substitutes `https://$host` on the way out. One image, correct on localhost, on testnet, on
# mainnet and on a preview deployment, with no rebuild and no environment variable. The HOST is the
# per-request half; the scheme is a literal, for a reason with its own comment at the directive.
#
# THREE THINGS ARE LOAD-BEARING ABOUT THAT AND EACH HAS ITS OWN COMMENT BELOW: `sub_filter_once off`
# (or only the first of the twelve placeholders in an article is replaced), `sub_filter_types` (or
# only `text/html` is, and the feed and the sitemap ship the placeholder raw), and the ABSENCE of
# `gzip_static` (a pre-compressed file is passed through untouched — the filter cannot see inside it
# — and the page ships with `__CF_ORIGIN__` visible in the markup).
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# ── THERE IS NO proxy_pass IN THIS FILE ───────────────────────────────────────────────────────────
#
# On every other frontend the answer is "the gateway routes /v1 to the service, not this container".
# Here there is no service at all. THERE IS NO micro-journal AND THERE IS NOT GOING TO BE ONE: an
# article is committed source, `src/content/` is the whole backend, and the day an archive needs a
# service to serve an essay is the day it acquired a database that can disagree with the repository,
# silently, on one host. This container serves files that were reviewed in a pull request.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ───────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/seo.test.ts reads that export and fails
# if this alternation has drifted from it. They are the words that name an environment rather than a
# surface: `surfaces.ts` reserves them so no surface may take one as a subdomain.
#
# On a publication this is the single most valuable line in the file, and it is worth being precise
# about why. Every article is byte-identical on both networks — there is no chain data in an essay —
# so the mainnet and testnet archives are not similar pages, they are THE SAME PAGE at two
# addresses. That is textbook duplicate content: a search engine picks one canonical and suppresses
# the other, and which one it picks is not ours to decide. `Disallow: /` on every non-mainnet
# hostname settles it before the question is asked.
#
# `(?:[^.]+-)?` catches BOTH shapes, for the same reason `splitEnvLabel()` in @cloudsforge/ui
# resolves both: the environment is a suffix on a surface's first label (`journal-testnet.<apex>`)
# or an apex prefix (`testnet.<apex>`). The suffix shape exists because Cloudflare's Universal SSL
# wildcard matches exactly ONE label, so `journal.testnet.<apex>` has no certificate at all and
# fails the handshake at the edge.
#
# THE MOVE TO A FOLDER MADE THE APEX-PREFIX BRANCH THE LIVE ONE HERE, and did not make the other
# dead. This publication's testnet address is now `testnet.<apex>/journal`, which the second branch
# matches on the host alone — the path plays no part, and does not need to. The suffix branch keeps
# `journal-testnet.<apex>` answering correctly for as long as that hostname resolves at all, which
# is through the redirect period and for as long after it as anybody's bookmark survives.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80. This is a fact about the IMAGE only, and it is not the
    # registry's devPort, which is 5196 — the port `vite.config.ts` binds when somebody runs the
    # bundle from a checkout, and which nothing in this file ever sees.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # An address must survive a hard refresh, and on this surface it must survive being pasted into
    # a message six months from now. `absolute_redirect off` keeps any redirect nginx does emit
    # relative, so a request that arrives through the tunnel is not bounced to `http://localhost`.
    absolute_redirect off;

    # ---- the origin substitution ------------------------------------------
    # Declared at server level so every location inherits it. See the header for the argument; what
    # follows is why each of the three lines is not optional.
    #
    # `sub_filter_once off` — ON is the default and it replaces only the FIRST match in a response.
    # An article carries the placeholder about a dozen times (canonical, og:url, twitter card, the
    # JSON-LD @id, the author @id, the publisher logo, every image), so the default would substitute
    # the canonical and ship the rest raw. That failure is invisible in a browser and total in a
    # crawler.
    #
    # `sub_filter_types` — the default is `text/html` ALONE. `feed.xml` and `sitemap.xml` are the two
    # files whose entire content is absolute URLs, and they are the two the default would skip.
    # text/html is listed anyway, because a reader of this file should not have to know it is
    # implicit. `text/plain` covered the `robots.txt` this surface no longer serves and stays for
    # `location = /healthz`: the cost of filtering a two-byte body is nothing, and a type quietly
    # dropped from this line is invisible until somebody opens a feed.
    #
    # AND NOTE WHAT IS ABSENT: `gzip_static`. It is the obvious optimisation for a directory of
    # static files and it would silently break every substitution above, because a pre-compressed
    # `.gz` is sent through untouched — the filter runs on the response body and cannot see inside a
    # deflate stream. nginx's ordinary `gzip` is safe and is applied AFTER this filter; that is the
    # difference, and it is not a difference anybody guesses correctly.
    #
    # ── AND THE SCHEME IS A LITERAL `https`, NOT `$scheme` ────────────────────────────────────────
    #
    # `$scheme://$host` is what this file was written with and it is wrong on every real request.
    # TLS ends at Cloudflare; cloudflared speaks plain HTTP to the gateway on 127.0.0.1 and the
    # gateway speaks plain HTTP to this container. `$scheme` is therefore `http` for a reader who
    # arrived over https, and the canonical, the `og:url` and every JSON-LD `@id` would name
    # `http://journal.<apex>/…` — a DIFFERENT URL to a search engine, and one that 301s the moment
    # anything follows it. A canonical that points at a redirect is a canonical a crawler discards,
    # so the page competes with itself. In a browser it is invisible: every link works.
    #
    # `X-Forwarded-Proto` is the header that carries the truth and it cannot be trusted here.
    # Traefik REPLACES it with the scheme of the entrypoint the request arrived on unless the
    # forwarder is listed in `forwardedHeaders.trustedIPs`, and `deploy/gateway/` sets no such list
    # — so the header would say `http` as well, with a second component in the way of finding out.
    #
    # A literal `https` is true for every hostname this image is ever published on: the edge has no
    # http listener to reach it over. On a plain-http checkout preview it names an https URL for a
    # page nothing will ever index, and that is the entire cost.
    sub_filter '__CF_ORIGIN__' 'https://$host';
    sub_filter_once off;
    sub_filter_types text/html text/xml application/xml application/rss+xml text/plain;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is public writing and a sibling surface embedding an article
    # is a use, not an attack. The operator console uses DENY and has the opposite argument.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its own
    # terms and must NOT fall through to the shell: a JavaScript request answered with HTML fails
    # with a syntax error that names the wrong file.
    #
    # ── AND NOT ONE PREFIX BELOW IS `^~`, WHICH IS THE ONE ORDERING FACT IN THIS FILE ─────────────
    #
    # nginx picks a location by: exact `=` first and it wins outright; then the LONGEST matching
    # prefix; then — unless that prefix carried `^~` — every regex in file order, and a regex that
    # matches beats the prefix. `^~` on `/journal/` would therefore be the natural-looking way to
    # say "everything under the mount is mine", and it would silently take the favicon regex further
    # down out of the running: the share card would be served by the catch-all with `no-store`
    # instead of a week, so every link-preview fetcher that ever draws a card for this publication
    # would re-fetch the picture, forever, for every paste. Plain prefixes, exactly as they were
    # when this surface was a hostname. `test/routes.test.ts` asserts the absence of `^~`.
    location /journal/assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location that
        # declares ANY add_header inherits NONE from its parent. So every location below that sets
        # Cache-Control must restate the security headers, or it silently serves without them —
        # which is exactly what `location /assets/` did in the web template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- the artwork -----------------------------------------------------
    # `/journal/articles/<slug>/hero.png` and `card.png`, generated by `scripts/make-assets.ts` and
    # committed.
    # They are NOT hashed — the filename is quoted in the article's own `og:image` and in every share
    # card that has already been posted, so it can never change — which is why this is a week rather
    # than a year. A regenerated hero reaches readers on the next Monday and reaches a link-preview
    # fetcher whenever it next looks, and neither of those is worth a cache-busting query string in
    # an address somebody may have saved.
    location /journal/articles/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- the feed --------------------------------------------------------
    # `application/rss+xml` explicitly. nginx's own table maps `.xml` to `text/xml`, which browsers
    # render as a tree of tags and some feed readers refuse outright. `types { }` empties the mime
    # table FOR THIS LOCATION so `default_type` is what applies — without it the `default_type` line
    # is inert, a declaration that reads as a decision and is not one.
    #
    # Fifteen minutes. A feed reader polls on its own schedule and a shorter age buys nothing; a
    # longer one means an article is published and nobody who subscribed hears about it until
    # tomorrow, which is the one thing a feed exists to prevent.
    location = /journal/feed.xml {
        types { }
        default_type application/rss+xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=900" always;
        # A non-mainnet archive publishes no feed, for the same reason it refuses every crawler
        # below: it is the same articles at a second address, and a subscriber who found it there
        # would be subscribed to a copy that can be taken down without notice.
        if ($cf_env) { return 404; }
    }

    # ---- the sitemap -----------------------------------------------------
    # IT IS A FILE, written by `scripts/prerender.ts`, not a `return 200` string composed here. That
    # is the opposite of what every other surface in the estate does and the reason is the corpus:
    # this sitemap has one entry per ARTICLE and per TOPIC, each with its own `lastmod` taken from the
    # article's own front matter, and nginx cannot know any of that. `src/lib/syndication.ts` builds
    # it from `content/index.ts`, so a new article is in the sitemap because it exists, not because
    # somebody remembered.
    #
    # It still needs `$host`, and gets it from the `sub_filter` above like everything else.
    #
    # A SITEMAP AT A SUBPATH IS LEGAL AND A robots.txt AT ONE IS NOT, which is why only one of the
    # pair survived the move to a folder. A sitemap may live anywhere provided every `<loc>` in it
    # sits under that path, and `/journal/sitemap.xml` listing `/journal/…` is exactly that shape.
    # The apex's own robots.txt in micro-site points at this file by name.
    location = /journal/sitemap.xml {
        types { }
        default_type application/xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of the
        # two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
    }

    # ---- THERE WAS A `location = /robots.txt` HERE, AND THE FOLDER DELETED IT -----------------
    #
    # It served the file the prerender wrote — `Disallow: /search` and nothing else — with a
    # `$cf_env` branch that answered `Disallow: /` whole on every non-mainnet hostname.
    #
    # A CRAWLER READS robots.txt AT THE ORIGIN ROOT AND NOWHERE ELSE. That is the entire argument.
    # `/journal/robots.txt` is a file nothing will ever request, so prefixing this block the way
    # every other one above was prefixed would have produced the worst available outcome: the only
    # copy of the search rule sitting in a document no machine opens, while `/journal/search?q=…`
    # became crawlable for the first time in this publication's life. A search page mints a distinct
    # address for every string anybody has ever typed, and a crawler that follows them files each
    # one as a page of this archive — forty pieces of writing indexed as four thousand near-empty
    # results, all of them ours, competing with the articles.
    #
    # Both lines moved to the apex's own robots.txt in micro-site: `Disallow: /journal/search`, and
    # a second `Sitemap:` naming the file served above.
    #
    # The `$cf_env` gate went with them and is STRICTLY BETTER there. The apex already answers
    # `Disallow: /` on every non-mainnet hostname, so the testnet archive is now covered by the host
    # it is served from rather than by a rule this repository has to remember to keep — and the
    # coverage arrives without this image having an opinion about it. The `map` above still earns
    # its place: the feed and the sitemap below it are refused per-environment from here, and those
    # ARE at paths a machine asks for by name.

    # ---- the four files at the mount root --------------------------------
    # Three favicons and the fallback share card. They are matched by a REGEX so they are decided
    # before the catch-all below — which would otherwise hand them the `no-store` that the HTML
    # needs and they do not.
    #
    # The share card is the one that matters. `og-1200x630.png` is what a chat app fetches when
    # somebody pastes a link to a page with no artwork of its own, and it is fetched by a machine
    # that has no session, no cookie and no reason to come back — so an uncached one is re-fetched
    # for every paste of every link, forever. A week matches `/articles/` above for the same reason:
    # the filename is quoted in markup that has already been posted and can never change.
    location ~ ^/journal/(favicon-[0-9]+x[0-9]+\.png|og-1200x630\.png)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- the shell, uncached ---------------------------------------------
    # index.html names the current asset hashes, so a stale copy pins a browser to a deploy that no
    # longer exists.
    #
    # `no-store` rather than a short max-age, and on a publication that deserves its own sentence
    # because it is the decision that costs something. Every HTML file here is per-request output:
    # the `sub_filter` above rewrites `__CF_ORIGIN__` into whatever `$host` this request arrived on,
    # so ONE article has as many correct bodies as it has hostnames. A cache that keys on the URL
    # alone — and that is what a `public` response invites — can hand the testnet body to a mainnet
    # reader, complete with a canonical tag pointing at the wrong archive. That is the exact defect
    # the placeholder exists to prevent, reintroduced one layer further out.
    #
    # The cost is real and small: an article is text, the artwork and the bundle are cached hard by
    # the two locations above, and what is re-fetched is a few kilobytes of markup.
    location = /journal/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the mount itself, with no trailing slash ------------------------
    # `/journal` is the address on the tile, in the product menu and in every link from the rest of
    # the estate, and it MUST NOT redirect to `/journal/`. A 301 on the publication's front door is
    # a hop every crawler, every link checker and every share-card fetcher pays on the way in, and
    # the estate's own links would all be pointing at the redirect rather than the page.
    #
    # IT DOES NOT, AND THE REASON IS SUBTLE ENOUGH TO WRITE DOWN. nginx would normally see that the
    # URI maps to a directory and emit the slash-redirect itself. It never gets the chance: this is
    # an EXACT location, so it wins outright, and `try_files` with a literal filename is a file
    # lookup that resolves to `html/journal/index.html` and serves it in place. The catch-all below
    # would do the same thing by a different route — `$uri` cannot match a directory, see its
    # comment — but an exact match is worth the eight lines for the front door.
    location = /journal {
        try_files /journal/index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /journal/index.html
        # here does NOT re-enter `location = /journal/index.html` above — and this location
        # therefore has to declare the no-store itself. Without it `/journal` ships with no
        # Cache-Control at all, which is the one document that must never be cached: it names the
        # hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- everything else under the mount: the prerendered pages ----------
    # `$uri` first, so a real file (a favicon, the og card, an asset outside /journal/assets/) is
    # served as itself. Then `$uri/index.html`, which is what turns `/journal/a/how-crypto-actually-works`
    # into the file the prerender wrote at `journal/a/how-crypto-actually-works/index.html` —
    # WITHOUT a redirect, so the address in the reader's bar is the address they were given. Then
    # 404, which is the point.
    #
    # THERE IS NO `/index.html` IN THAT LIST. That single omission is the difference between this
    # file and the SPA fallback the header refuses; `test/routes.test.ts` asserts its absence rather
    # than trusting anybody to notice it going back in.
    #
    # AND THERE IS NO `$uri/` IN IT EITHER, WHICH IS THE LESS OBVIOUS HALF. It reads like the
    # harmless "also accept a trailing slash" element and it is not: it is the only element that
    # matches a DIRECTORY, and `journal/a/` is a directory with no `index.html` in it — the articles
    # live one level down and nothing is published at `/journal/a`. With `$uri/` in the chain nginx
    # matched that directory and answered `/journal/a` with a 301 to `/journal/a/`, so an address
    # this publication does not have was a redirect rather than a 404, and `/journal/a/` then
    # answered 403 because a directory it may not list is forbidden rather than absent. Two wrong
    # answers for one non-address, both of which a crawler follows and neither of which says "there
    # is nothing here". Measured by the image probe in CI on 2026-08-17, which is the only thing
    # that can see it: the config reads fine.
    #
    # Nothing is lost. A trailing-slash request is served by the SECOND element — `$uri` is
    # `/journal/topics/`, so the chain tests `/journal/topics//index.html`, and a doubled separator
    # in a filesystem path is one separator. The first element cannot match a directory at all,
    # because try_files decides "this name is a directory test" from the LITERAL trailing slash in
    # this file when the config is parsed, not from what the variable expands to at request time.
    # That last sentence is also what makes the front door above work without a redirect.
    location /journal/ {
        try_files $uri $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- and nothing outside the mount ------------------------------------
    # This image serves one folder. `/`, `/about`, `/pricing` and every other apex address belong to
    # micro-site, and the gateway routes them there — this block only decides what happens when
    # something reaches this container that the gateway did not intend to send.
    #
    # 404 RATHER THAN A REDIRECT TO `/journal`, deliberately. A redirect here would make this
    # container answer plausibly for addresses it does not own, which is the failure the estate has
    # already been bitten by twice: a stale Traefik router pointing at the wrong backend is invisible
    # for as long as the wrong backend replies with something that looks like a page (micro-org#428).
    # A blank 404 from a surface that should never have been asked is a symptom somebody can see.
    #
    # It carries no `error_page` of its own, so a request here gets the designed 404 below like any
    # other miss — which is the right answer for a reader who guessed, and an honest status for
    # everything that is not a reader.
    location / {
        return 404;
    }

    # The designed 404, served under a real 404. `/journal/404.html` is a FILE and not a route — it
    # is in `pageEntries()` in `src/lib/heads.ts` with a canonical of `/journal/404`, which no
    # crawler will ever request and which is better than the alternatives: no canonical leaves the
    # tag inherited from index.html by anyone who copies the file, and a canonical of `/journal`
    # would tell a search engine that the archive and the error page are one document.
    #
    # `error_page` takes a URI and re-enters location matching with it, which is why this one is
    # prefixed and `internal` below still catches an outside request for it.
    error_page 404 /journal/404.html;
    location = /journal/404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # nginx's own health, for the container probe. It answers before anything has been fetched, so it
    # says the server is up and never that the publication is good. On this surface that gap is
    # smaller than anywhere else in the estate — there is no service behind it to be down — which is
    # exactly why it must not be mistaken for a content check. A green probe here is consistent with
    # `dist` being empty of articles.
    #
    # THE ONE LOCATION THAT IS NOT PREFIXED, AND IT IS NOT AN OVERSIGHT. This address belongs to the
    # CONTAINER, not to the publication: it is dialled by the Dockerfile's HEALTHCHECK and by the
    # deployment's readiness probe, both of which reach the pod on 8080 directly and neither of
    # which knows or should know where the gateway mounts it. `/journal/healthz` would also be a
    # public address, answering 200 to anything that asked, and a health endpoint on the open
    # internet is a thing to explain rather than a thing to have.
    #
    # ACROSS REAL LINES: nginx does not process backslash escapes in a quoted string, so `"ok\n"`
    # answers the probe with a backslash and an n. Harmless in a health check and worth not writing
    # ten lines under a comment saying so.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok
';
    }
}
